<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormFlow Academy</title>
  <style>
    :root {
      --green-900: #14532d;
      --green-700: #15803d;
      --green-600: #16a34a;
      --green-100: #dcfce7;
      --green-50: #f0fdf4;
      --ink: #16331f;
      --muted: #668071;
      --border: #d9e8dd;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(22, 163, 74, 0.11), transparent 25rem),
        linear-gradient(135deg, #f7fcf8 0%, #eef8f1 100%);
    }

    .app {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 14px;
      color: var(--white);
      background: var(--green-600);
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.22);
      font-size: 23px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: var(--green-900);
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -0.04em;
    }

    .version {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .version strong {
      color: var(--green-700);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.72fr) minmax(380px, 1.28fr);
      gap: 24px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 12px 32px rgba(21, 128, 61, 0.07);
    }

    .form-card {
      width: min(100%, 360px);
      padding: 20px;
    }

    .card h2 {
      margin: 0 0 6px;
      color: var(--green-900);
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: var(--green-900);
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input::placeholder { color: #93a79a; }

    input:focus {
      border-color: var(--green-600);
      box-shadow: 0 0 0 4px var(--green-100);
    }

    button {
      width: 100%;
      height: 42px;
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      background: var(--green-600);
      color: var(--white);
      box-shadow: 0 10px 22px rgba(22, 163, 74, 0.18);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      background: var(--green-700);
      box-shadow: 0 12px 26px rgba(21, 128, 61, 0.24);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    .students-card {
      overflow: hidden;
    }

    .students-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .students-header h2 { margin: 0; }

    .count {
      min-width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--green-100);
      color: var(--green-700);
      font-size: 13px;
      font-weight: 800;
    }

    ul {
      min-height: 180px;
      margin: 0;
      padding: 10px 16px 16px;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0;
      padding: 14px 12px;
      border-radius: 12px;
      color: var(--ink);
      transition: background 160ms ease;
    }

    li:hover { background: var(--green-50); }

    li::before {
      content: "";
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border: 2px solid var(--green-100);
      border-radius: 50%;
      background: var(--green-600);
      box-shadow: 0 0 0 3px var(--green-50);
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 28px, 560px);
        padding: 28px 0;
      }

      .grid { grid-template-columns: 1fr; }
      .form-card { padding: 22px; }
      .students-header { padding: 20px 22px 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div>
          <h1>FormFlow Academy</h1>
          <p class="version"><strong>Release Version:</strong> <span id="version">v1.0.0</span></p>
        </div>
      </div>
    </header>

    <div class="grid">
      <section class="card form-card" aria-labelledby="registration-title">
        <h2 id="registration-title">Student registration</h2>
        <p class="card-subtitle">Add a new student to the academy.</p>

        <form id="studentForm">
          <label for="name">Student name</label>
          <input type="text" id="name" placeholder="Enter full name" required />

          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="name@example.com" required />

          <button type="submit">Register student</button>
        </form>
      </section>

      <section class="card students-card" aria-labelledby="students-title">
        <div class="students-header">
          <h2 id="students-title">Enrolled students</h2>
          <span class="count" id="studentCount">0</span>
        </div>
        <ul id="studentList"></ul>
      </section>
    </div>
  </main>

  <script>
    async function loadStudents() {
      const res = await fetch("/api/students");
      const students = await res.json();
      document.getElementById("studentCount").textContent = students.length;
      document.getElementById("studentList").innerHTML = students
        .map((s) => `<li>${s.name} — ${s.email}</li>`)
        .join("") || "<li>No students enrolled yet</li>";
    }

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch("/api/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
        }),
      });
      e.target.reset();
      loadStudents();
    });

    loadStudents();
  </script>
</body>
</html>
